<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yes Chef · counter (staff)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FFFFFF; --ink: #14213D; --muted: #5B6478; --line: #D8DCE6;
    --accent: #FFC93C; --ok: #1F6F4A; --no: #C0392B; --held: #A9690F;
    --serif: "Fraunces", Georgia, serif;
    --sans: "Public Sans", system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; overflow: hidden; }
  body { background: var(--bg); color: var(--ink); font: 16px/1.45 var(--sans); }
  button, input { font: inherit; color: inherit; }
  .link { background: none; border: 0; padding: 0; color: var(--muted); text-decoration: underline; cursor: pointer; font-size: 15px; }
  .link:hover { color: var(--ink); }

  .wrap { height: 100vh; max-width: 560px; margin: 0 auto; padding: 28px 20px 18px; display: flex; flex-direction: column; gap: 22px; }
  .wrap > * { flex: none; }

  .conn { position: fixed; top: 10px; right: 10px; width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
  .conn.live { background: var(--ok); } .conn.mock { background: var(--accent); } .conn.offline { background: var(--no); }

  .who { text-align: center; }
  .who .label { font-size: 15px; color: var(--muted); margin-bottom: 8px; }
  .seg { display: inline-flex; gap: 8px; }
  .seg button { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 7px 16px; cursor: pointer; font-size: 16px; }
  .seg button[aria-pressed="true"] { border-color: var(--ink); background: var(--ink); color: var(--bg); font-weight: 700; }
  .osess { font-size: 15px; margin-top: 8px; }
  .osess.on { color: var(--ok); }
  .osess.on::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--ok); margin-right: 8px; vertical-align: middle; }
  .osess.off { color: var(--held); }

  .talk { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .mic { width: 140px; height: 140px; border-radius: 50%; border: 0; background: var(--accent); color: var(--ink); font-weight: 700; font-size: 19px; line-height: 1.2;
         cursor: pointer; touch-action: none; user-select: none; -webkit-user-select: none; }
  .mic small { display: block; font-weight: 400; font-size: 15px; }
  .mic.rec { background: var(--ink); color: var(--bg); }
  .mic.busy { opacity: 0.6; }
  .heard { font-size: 15px; color: var(--muted); max-width: 100%; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .heard:empty { display: none; }
  .say { font-family: var(--serif); font-weight: 500; font-size: 26px; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .say:empty { display: none; }
  .say.blocked { color: var(--no); } .say.held { color: var(--held); }
  .typed { display: flex; gap: 8px; width: 100%; }
  .typed[hidden] { display: none; }
  .typed input { flex: 1; min-width: 0; border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; font-size: 16px; background: var(--bg); }
  .typed button { border: 1px solid var(--ink); background: var(--bg); border-radius: 6px; padding: 8px 14px; cursor: pointer; }
  .err { color: var(--no); font-size: 15px; }
  .err:empty { display: none; }

  .what { flex: 1 1 auto; min-height: 60px; display: flex; flex-direction: column; border-top: 1px solid var(--line); padding-top: 14px; }
  .what-body { flex: 1 1 auto; min-height: 0; overflow-y: auto; }
  .lines, .steps { list-style: none; padding: 0; }
  .line, .step { display: grid; grid-template-columns: 8px minmax(0, 1fr); column-gap: 10px; padding: 2px 0; font-size: 15px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ink); margin-top: 7px; }
  .ok .dot { background: var(--ok); } .blocked .dot, .fail .dot { background: var(--no); } .held .dot { background: var(--held); }
  .line.blocked, .line.fail { color: var(--no); } .line.held { color: var(--held); }
  .steps { margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--line); }
  .steps[hidden] { display: none; }
  .step b { font-weight: 600; }
  .step .d { color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .step.working, .line.working { color: var(--muted); }
  .empty { color: var(--muted); font-size: 15px; }
  .what-foot { padding-top: 6px; }

  .footbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .stopped { display: none; color: var(--no); font-weight: 700; font-size: 15px; width: 100%; }
  body.is-halted .stopped { display: block; }
  .kill-btn { background: var(--bg); border: 2px solid var(--no); color: var(--no); font-weight: 700; border-radius: 6px; padding: 8px 22px; cursor: pointer; }
  .resume-btn { background: var(--ink); border: 2px solid var(--ink); color: var(--bg); font-weight: 700; border-radius: 6px; padding: 8px 22px; cursor: pointer; }
  .drawer-btn.has { color: var(--held); font-weight: 700; }

  .drawer { position: fixed; left: 50%; transform: translateX(-50%); width: min(560px, calc(100vw - 24px)); bottom: 64px; max-height: calc(100vh - 110px); overflow-y: auto; z-index: 30;
            background: var(--bg); border: 1px solid var(--ink); border-radius: 6px; padding: 14px 18px; }
  .drawer[hidden] { display: none; }
  .drawer h2 { font-size: 16px; font-weight: 700; margin: 4px 0 6px; }
  .drawer .part + .part { border-top: 1px solid var(--line); margin-top: 12px; padding-top: 10px; }
  .slow { display: inline-flex; align-items: center; gap: 8px; font-size: 15px; cursor: pointer; }
  .slow input { width: 16px; height: 16px; accent-color: var(--ink); }
  table { width: 100%; border-collapse: collapse; font-size: 15px; }
  td, th { text-align: left; padding: 4px 6px 4px 0; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 400; }
  td.no { color: var(--no); } td.disc { color: var(--held); } td.muted { color: var(--muted); }
  tr.flash td { animation: fade 1.8s; }
  @keyframes fade { from { background: var(--accent); } to { background: transparent; } }
  .pend { padding: 6px 0; font-size: 15px; }
  .pend + .pend { border-top: 1px solid var(--line); }
  .pend .claim { color: var(--held); font-weight: 700; }
  .pend .u, .pend .r { color: var(--muted); }
  .hint { font-size: 15px; color: var(--muted); }
  .owner-qr { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .owner-qr[hidden] { display: none; }
  .qrbox { width: 120px; height: 120px; }
  .qrbox svg { width: 100%; height: 100%; display: block; }
  .links { font-size: 15px; color: var(--muted); }
  .links a { color: var(--ink); }
  @media (max-height: 640px) { .mic { width: 112px; height: 112px; } .wrap { gap: 14px; padding-top: 16px; } }
</style>
</head>
<body>
<span class="conn" id="conn" title="connecting"></span>
<div class="wrap">
  <section class="who" title="Who is speaking: a claim, not proof. Owner authority comes only from Marie's own device.">
    <div class="label">Speaking as</div>
    <div class="seg" role="group" aria-label="Speaking as">
      <button type="button" data-human="usr_marie" aria-pressed="true">Marie · owner</button>
      <button type="button" data-human="usr_sam" aria-pressed="false">Sam · employee</button>
    </div>
    <div class="osess off" id="osess">Marie is not checked in</div>
  </section>

  <section class="talk">
    <button class="mic" id="mic" type="button" aria-label="Hold to talk">Hold to talk<small>or hold space</small></button>
    <div class="heard" id="heard"></div>
    <div class="say" id="say"></div>
    <form class="typed" id="typed" hidden>
      <input id="typedText" type="text" autocomplete="off" placeholder="We're out of croissants" aria-label="Type a command">
      <button type="submit">Send</button>
    </form>
    <button class="link" id="typeToggle" type="button">Type instead</button>
    <div class="err" id="err"></div>
  </section>

  <section class="what" aria-label="What happened">
    <div class="what-body" id="whatBody">
      <ul class="lines" id="summary"><li class="empty">Nothing yet.</li></ul>
      <ol class="steps" id="steps" hidden><li class="empty">No run yet.</li></ol>
    </div>
    <div class="what-foot"><button class="link" id="stepsToggle" type="button">Show every step</button></div>
    <div id="traceq" hidden></div>
  </section>

  <div class="footbar">
    <div class="stopped" role="alert">Updates are stopped</div>
    <button class="kill-btn" id="halt" type="button" title="Stops publishing immediately; a run in progress is rolled back">Stop</button>
    <button class="resume-btn" id="resume" type="button" hidden>Resume</button>
    <button class="link drawer-btn" id="drawerBtn" type="button" aria-expanded="false" aria-controls="drawer">More</button>
  </div>
</div>

<div class="drawer" id="drawer" hidden>
  <div class="part">
    <h2>Waiting for the owner</h2>
    <div id="pending"><div class="empty">Nothing waiting.</div></div>
  </div>
  <div class="part">
    <label class="slow" title="Adds a pause between sign, menu and till so the stop switch can be shown mid-run">
      <input type="checkbox" id="slow" disabled> Slow mode: pause between targets (for showing the stop switch)
    </label>
    <div class="hint" id="haltHint">Stop halts publishing immediately; any run in progress is rolled back.</div>
  </div>
  <div class="part">
    <h2>Till</h2>
    <table>
      <thead><tr><th>Item</th><th>Price</th><th>Status</th><th>Discount</th></tr></thead>
      <tbody id="till"></tbody>
    </table>
  </div>
  <div class="part owner-qr" id="ownerQr" hidden>
    <div><h2>Owner's phone</h2><div class="hint">Scan to open approvals</div><a id="ownerLink" target="_blank" class="hint">Open link</a></div>
    <div class="qrbox" id="ownerQrCode"></div>
  </div>
  <div class="part links" id="links"></div>
</div>

<audio id="earcon" preload="auto"></audio>
<audio id="voice"></audio>
<script src="/vendor/qrcode.js"></script>
    <script src="/app.js"></script>
    <script>
      (function () {
        var esc = YC.esc,
          money = YC.money;
        var $ = function (id) {
          return document.getElementById(id);
        };
        var human = "usr_marie";
        var state = null;
        var busy = false;

        // links
        var k = YC.KEY ? "key=" + encodeURIComponent(YC.KEY) : "";
        $("links").innerHTML =
          ["/sign", "/menu", "/record"]
            .map(function (p) {
              return (
                '<a href="' + YC.withMock(p) + '" target="_blank">' + p + "</a>"
              );
            })
            .join(" · ") + " · approve link is the owner's";

        // speaker switch
        document.querySelectorAll(".seg button").forEach(function (b) {
          b.addEventListener("click", function () {
            human = b.getAttribute("data-human");
            document.querySelectorAll(".seg button").forEach(function (x) {
              x.setAttribute("aria-pressed", String(x === b));
            });
          });
        });

        // earcons: preload
        var earconSrc = {
          ok: "/sounds/ok.mp3",
          blocked: "/sounds/blocked.mp3",
          held: "/sounds/held.mp3",
        };
        var earconCache = {};
        Object.keys(earconSrc).forEach(function (n) {
          var a = new Audio(earconSrc[n]);
          a.preload = "auto";
          earconCache[n] = a;
        });
        function playEarcon(kind) {
          return new Promise(function (resolve) {
            var a = earconCache[kind];
            if (!a) return resolve();
            try {
              a.currentTime = 0;
            } catch (e) {}
            var done = false;
            function fin() {
              if (!done) {
                done = true;
                resolve();
              }
            }
            a.onended = fin;
            setTimeout(fin, 900);
            var p = a.play();
            if (p && p.catch) p.catch(fin);
          });
        }
        function classify(result) {
          var st = (result.results || []).map(function (r) {
            return r.status;
          });
          if (
            st.some(function (s) {
              return (
                s === "blocked" ||
                s === "rejected" ||
                s === "failed" ||
                s === "halted"
              );
            })
          )
            return "blocked";
          if (
            st.some(function (s) {
              return s === "pending_approval";
            })
          )
            return "held";
          if (
            st.some(function (s) {
              return (
                s === "verified" ||
                s === "applied" ||
                s === "allowed" ||
                s === "explained"
              );
            })
          )
            return "ok";
          return "held";
        }

        async function speak(text) {
          if (!text) return;
          if (YC.MOCK) {
            if ("speechSynthesis" in window) {
              var u = new SpeechSynthesisUtterance(text);
              u.lang = "en-GB";
              speechSynthesis.speak(u);
            }
            return;
          }
          try {
            var r = await YC.api("/api/tts", {
              json: { text: text },
              raw: true,
            });
            if (!r.ok) throw new Error("tts " + r.status);
            var blob = await r.blob();
            var v = $("voice");
            v.src = URL.createObjectURL(blob);
            await v.play();
          } catch (e) {
            console.warn("TTS failed, using browser voice", e);
            if ("speechSynthesis" in window)
              speechSynthesis.speak(new SpeechSynthesisUtterance(text));
          }
        }

        // Speak a reply: earcon first while the TTS audio is fetched.
        var spoken = {}; // run_id|say already spoken (own replies + pushed traces)
        var primed = false; // first pushed trace is history: never spoken
        async function announce(kind, say) {
          if (YC.MOCK) {
            await playEarcon(kind);
            await speak(say);
            return;
          }
          var ttsP = say
            ? YC.api("/api/tts", { json: { text: say }, raw: true })
                .then(function (r) { return r.ok ? r.blob() : null; })
                .catch(function () { return null; })
            : Promise.resolve(null);
          await playEarcon(kind);
          var blob = await ttsP;
          if (blob) {
            var v = $("voice");
            v.src = URL.createObjectURL(blob);
            v.play().catch(function (e) { console.warn(e); });
          } else if (say && "speechSynthesis" in window)
            speechSynthesis.speak(new SpeechSynthesisUtterance(say));
        }
        function traceKind(t) {
          var st = (t.steps || []).map(function (x) { return x.status; }).filter(function (x) { return x !== "info"; });
          var last = st[st.length - 1];
          if (last === "blocked" || last === "fail") return "blocked";
          if (last === "held") return "held";
          return "ok";
        }
        // A finished run this page did not start (e.g. the owner approved on a phone): speak it once.
        function maybeSpeakTrace(t) {
          if (!primed) {
            primed = true; // whatever trace is there on first load is history
            if (t && t.done && t.say) spoken[(t.run_id || "") + "|" + t.say] = true;
            return;
          }
          if (!t || !t.done || !t.say) return;
          var k = (t.run_id || "") + "|" + t.say;
          if (spoken[k] || busy) return; // while our own utterance is in flight its reply is spoken from the response
          spoken[k] = true;
          $("say").textContent = t.say;
          $("say").className = "say " + traceKind(t);
          announce(traceKind(t), t.say);
        }

        async function send(text, stt) {
          text = (text || "").trim();
          if (!text) return;
          $("heard").textContent = "“" + text + "”";
          $("say").textContent = "…";
          $("say").className = "say";
          $("err").textContent = "";
          busy = true;
          $("mic").classList.add("busy");
          try {
            var res = await YC.api("/api/utterance", {
              json: { human_id: human, text: text, stt: stt },
            });
            var kind = classify(res);
            $("say").textContent = res.say || "";
            $("say").className = "say " + kind;
            spoken[(res.run_id || "") + "|" + (res.say || "")] = true;
            await announce(kind, res.say);
          } catch (e) {
            $("err").textContent = "Utterance failed: " + e.message;
          } finally {
            busy = false;
            $("mic").classList.remove("busy");
            if (state && state.trace) maybeSpeakTrace(state.trace);
          }
        }

        // ---------- hold to talk
        var stream = null,
          rec = null,
          chunks = [],
          recording = false,
          startedAt = 0;
        async function startRec() {
          if (recording || busy) return;
          recording = true;
          $("mic").classList.add("rec");
          $("err").textContent = "";
          if (YC.MOCK) {
            startedAt = Date.now();
            return;
          }
          try {
            if (!stream)
              stream = await navigator.mediaDevices.getUserMedia({
                audio: {
                  noiseSuppression: true,
                  echoCancellation: true,
                  autoGainControl: true,
                },
              });
            if (!recording) return; // released while permission prompt was up
            chunks = [];
            var mime = [
              "audio/webm;codecs=opus",
              "audio/webm",
              "audio/mp4",
              "audio/ogg",
            ].filter(function (m) {
              return (
                window.MediaRecorder &&
                MediaRecorder.isTypeSupported &&
                MediaRecorder.isTypeSupported(m)
              );
            })[0];
            rec = mime
              ? new MediaRecorder(stream, { mimeType: mime })
              : new MediaRecorder(stream);
            rec.ondataavailable = function (e) {
              if (e.data && e.data.size) chunks.push(e.data);
            };
            rec.start();
            startedAt = Date.now();
          } catch (e) {
            recording = false;
            $("mic").classList.remove("rec");
            $("err").textContent =
              "Microphone unavailable: " + e.message + ". Use the typed box.";
          }
        }
        async function stopRec() {
          if (!recording) return;
          recording = false;
          $("mic").classList.remove("rec");
          if (YC.MOCK) {
            $("heard").textContent = "Transcribing…";
            var m = await YC.api("/api/stt", { body: "" });
            return send(m.text, "elevenlabs");
          }
          if (!rec) return;
          var r = rec;
          rec = null;
          var blob = await new Promise(function (resolve) {
            r.onstop = function () {
              resolve(new Blob(chunks, { type: r.mimeType || "audio/webm" }));
            };
            try {
              r.stop();
            } catch (e) {
              resolve(null);
            }
          });
          if (!blob || blob.size < 1200 || Date.now() - startedAt < 300) {
            $("err").textContent =
              "Too short. Hold the button while you speak.";
            return;
          }
          $("heard").textContent = "Transcribing…";
          try {
            var out = await YC.api("/api/stt", {
              body: blob,
              headers: { "content-type": blob.type || "audio/webm" },
            });
            if (!out || !out.text) {
              $("heard").textContent = "(heard nothing)";
              return;
            }
            await send(out.text, "elevenlabs");
          } catch (e) {
            $("heard").textContent = "…";
            $("err").textContent = "Speech-to-text failed: " + e.message;
          }
        }
        var mic = $("mic");
        mic.addEventListener("pointerdown", function (e) {
          e.preventDefault();
          try {
            mic.setPointerCapture(e.pointerId);
          } catch (x) {}
          startRec();
        });
        mic.addEventListener("pointerup", function () {
          stopRec();
        });
        mic.addEventListener("pointercancel", function () {
          stopRec();
        });
        mic.addEventListener("contextmenu", function (e) {
          e.preventDefault();
        });
        function typingTarget(t) {
          return (
            t &&
            (t.tagName === "INPUT" ||
              t.tagName === "TEXTAREA" ||
              t.isContentEditable)
          );
        }
        window.addEventListener("keydown", function (e) {
          if (e.code !== "Space" || typingTarget(e.target)) return;
          e.preventDefault();
          if (!e.repeat) startRec();
        });
        window.addEventListener("keyup", function (e) {
          if (e.code !== "Space" || typingTarget(e.target)) return;
          e.preventDefault();
          stopRec();
        });

        $("typed").addEventListener("submit", function (e) {
          e.preventDefault();
          var t = $("typedText").value;
          $("typedText").value = "";
          send(t, "typed");
        });

        // ---------- kill switch
        $("halt").addEventListener("click", function () {
          YC.api("/api/halt", { json: { halt: true } }).catch(function (e) {
            $("err").textContent = "Halt failed: " + e.message;
          });
        });
        $("resume").addEventListener("click", function () {
          YC.api("/api/halt", { json: { halt: false } }).catch(function (e) {
            $("err").textContent = "Clear failed: " + e.message;
          });
        });

        // ---------- render from pushed state
        var KEYNAME = {
          heard: "heard",
          extracted: "extracted",
          planned: "planned",
          gate: "gate",
          target: "target",
          verified: "verified",
          note: "note",
        };
        var prevTill = {};
        // ---------- "What happened": a short summary built from trace steps
        var lastTraceKey = null;
        var TWORD = { ok: "Allowed", blocked: "Blocked", held: "Held for the owner" };
        function joinList(a) {
          return a.length <= 1 ? a.join("") : a.slice(0, -1).join(", ") + " and " + a[a.length - 1];
        }
        function summarize(t) {
          var out = [], gates = {}, current = null, pubs = [];
          function flushPub() {
            if (current && current.targets.length) pubs.push(current);
            current = null;
          }
          (t.steps || []).forEach(function (st) {
            var label = st.label || "", detail = st.detail || "";
            if (st.key === "heard") { out.push({ status: "info", text: label }); return; }
            if (st.key === "extracted" || st.key === "planned") return;
            if (st.key === "gate") {
              flushPub();
              var m = label.match(/^(Allowed|Blocked|Held for the owner):\s*(.*)$/);
              if (!m) { out.push({ status: st.status, text: label }); return; }
              var rule = detail.split(" · ")[0];
              var k = st.status + "|" + (st.status === "blocked" ? detail : rule);
              if (!gates[k]) {
                gates[k] = { status: st.status, word: TWORD[st.status] || m[1], rule: rule, detail: detail, whats: [] };
                out.push(gates[k]);
              }
              gates[k].whats.push(m[2]);
              if (st.status === "ok") current = { what: m[2], targets: [], verb: "Published to", readBack: false, fail: false };
              return;
            }
            if (st.key === "target") {
              var tm = label.match(/^(.*?)\s+(updated|written|restored)$/i);
              if (tm && current && st.status === "ok") {
                current.targets.push(tm[1].toLowerCase());
                if (/restored/i.test(tm[2])) current.verb = "Restored";
                return;
              }
              out.push({ status: st.status, text: label });
              return;
            }
            if (st.key === "verified") {
              if (current && st.status === "ok") { current.readBack = true; flushPub(); return; }
              out.push({ status: st.status, text: label });
              return;
            }
            out.push({ status: st.status, text: label }); // notes
          });
          flushPub();
          var lines = out.map(function (g) {
            if (!g.word) return g;
            var n = g.whats.length;
            var text = g.word + " · " + (g.status === "blocked" ? g.detail : g.rule) + (n > 1 ? " (" + n + " actions)" : " · " + g.whats[0]);
            return { status: g.status, text: text };
          });
          pubs.forEach(function (p) {
            lines.push({ status: "ok", text: p.verb + " " + joinList(p.targets) + (p.readBack ? " · read back" : "") + (pubs.length > 1 ? " · " + p.what : "") });
          });
          if (!t.done) lines.push({ status: "working", text: "Working…" });
          return lines;
        }
        // remembered toggles
        function pref(k, v) {
          try { if (v === undefined) return localStorage.getItem(k) === "1"; localStorage.setItem(k, v ? "1" : "0"); } catch (e) {}
          return false;
        }
        function showTyped(on, focus) {
          $("typed").hidden = !on;
          $("typeToggle").textContent = on ? "Hide typing" : "Type instead";
          if (on && focus) $("typedText").focus();
        }
        showTyped(pref("yc-counter-typed"), false);
        $("typeToggle").addEventListener("click", function () {
          var on = $("typed").hidden;
          pref("yc-counter-typed", on);
          showTyped(on, true);
        });
        function showSteps(on) {
          $("steps").hidden = !on;
          $("stepsToggle").textContent = on ? "Hide steps" : "Show every step";
        }
        showSteps(pref("yc-counter-allsteps"));
        $("stepsToggle").addEventListener("click", function () {
          var on = $("steps").hidden;
          pref("yc-counter-allsteps", on);
          showSteps(on);
        });

        function drawOwnerSession() {
          var left = YC.ownerLeftMs(state), el = $("osess");
          if (left > 0) {
            el.className = "osess on";
            el.textContent = "Marie is checked in · " + YC.mmss(left);
            el.title = "Marie opened an owner session from her own device; requests made as Marie run as the owner.";
          } else {
            el.className = "osess off";
            el.textContent = "Marie is not checked in";
            el.title = "Requests made as Marie here are held and sent to her phone.";
          }
        }
        setInterval(drawOwnerSession, 1000);
        function render(s) {
          state = s;
          drawOwnerSession();
          maybeSpeakTrace(s.trace);
          document.body.classList.toggle("is-halted", !!s.halted);
          $("halt").hidden = !!s.halted;
          $("resume").hidden = !s.halted;
          $("haltHint").textContent = s.halted
            ? "Stopped. Resume updates to let changes through again."
            : "Stop halts publishing immediately; any run in progress is rolled back.";

          var t = s.trace;
          if (t && t.steps) {
            var tkey = t.run_id + "|" + t.steps.length + "|" + t.done;
            if (tkey !== lastTraceKey) {
              lastTraceKey = tkey;
              $("summary").innerHTML = summarize(t).map(function (ln) {
                return '<li class="line ' + esc(ln.status) + '"><span class="dot"></span><div>' + esc(ln.text) + "</div></li>";
              }).join("");
              var html = t.steps.map(function (st) {
                return '<li class="step ' + esc(st.status) + '"><span class="dot"></span><div><b>' + esc(st.label) + "</b>" +
                  (st.detail ? '<div class="d">' + esc(st.detail) + "</div>" : "") + "</div></li>";
              }).join("");
              if (!t.done) html += '<li class="step working"><span class="dot"></span><div>Working…</div></li>';
              $("steps").innerHTML = html;
              var wb = $("whatBody");
              wb.scrollTop = $("steps").hidden ? 0 : wb.scrollHeight;
            }
          }

          $("till").innerHTML = (s.till || [])
            .map(function (r) {
              var sig = [r.price, r.available, r.discount_pct].join("|");
              var changed =
                prevTill[r.item_id] !== undefined &&
                prevTill[r.item_id] !== sig;
              prevTill[r.item_id] = sig;
              return (
                '<tr class="' +
                (changed ? "flash" : "") +
                '"><td>' +
                esc(YC.itemName(s, r.item_id)) +
                '</td><td class="num">' +
                esc(money(r.price)) +
                (r.available ? "</td><td>available" : '</td><td class="no">sold out') +
                (r.discount_pct ? '</td><td class="disc">' + esc(r.discount_pct) + "% off" : '</td><td class="muted">none') +
                "</td></tr>"
              );
            })
            .join("");

          var p = s.pending || [];
          $("drawerBtn").textContent = p.length ? "More (" + p.length + " waiting)" : "More";
          $("drawerBtn").classList.toggle("has", p.length > 0);
          $("pending").innerHTML = p.length
            ? p
                .map(function (a) {
                  return (
                    '<div class="pend">' +
                    (a.claimed_as
                      ? '<div class="claim">' + esc(a.requested_by) + ", speaking as " + esc(a.claimed_as) + " (not proven; sent to her phone)</div>"
                      : "") +
                    "<b>" +
                    esc(a.requested_by) +
                    "</b> (" +
                    esc(a.role) +
                    ") asked: " +
                    esc(a.summary) +
                    '<div class="u">“' +
                    esc(a.utterance) +
                    '”</div><div class="r">Held: ' +
                    esc(a.reason) +
                    "</div></div>"
                  );
                })
                .join("")
            : '<div class="empty">Nothing waiting.</div>';
        }

        // ---------- drawer (till, pending, owner QR)
        $("drawerBtn").addEventListener("click", function () {
          var d = $("drawer"), open = d.hidden;
          d.hidden = !open;
          d.style.bottom = window.innerHeight - document.querySelector(".footbar").getBoundingClientRect().top + 8 + "px";
          this.setAttribute("aria-expanded", String(open));
        });

        // ---------- slow mode (GET/POST /api/config)
        var slowEl = $("slow");
        (YC.MOCK ? Promise.resolve({ slow: false }) : YC.api("/api/config"))
          .then(function (c) { slowEl.checked = !!(c && c.slow); slowEl.disabled = false; })
          .catch(function (e) { console.warn("config", e); slowEl.disabled = false; });
        slowEl.addEventListener("change", function () {
          var want = slowEl.checked;
          slowEl.disabled = true;
          (YC.MOCK ? Promise.resolve({ slow: want }) : YC.api("/api/config", { json: { slow: want } }))
            .then(function (c) { slowEl.checked = c && typeof c.slow === "boolean" ? c.slow : want; })
            .catch(function (e) { slowEl.checked = !want; $("err").textContent = "Slow mode change failed: " + e.message; })
            .then(function () { slowEl.disabled = false; });
        });

        var ownerKey = YC.qs.get("owner");
        if (ownerKey) {
          YC.config().then(function (c) {
            if (!c.public_url) return;
            var url = c.public_url + "/approve?key=" + encodeURIComponent(ownerKey);
            try {
              var qr = qrcode(0, "M");
              qr.addData(url);
              qr.make();
              $("ownerQrCode").innerHTML = qr.createSvgTag({ cellSize: 3, margin: 0, scalable: true });
            } catch (e) { console.warn("owner QR failed", e); }
            $("ownerLink").href = url;
            $("ownerQr").hidden = false;
          });
        }

        YC.connect(render, function (st) {
          var c = $("conn");
          c.title = st === "mock" ? "mock data" : st;
          c.className = "conn " + st;
        });
      })();
    </script>
  </body>
</html>
