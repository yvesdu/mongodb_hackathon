<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chez Marie · sign (customers)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #fffdf6;
        --ink: #14213d;
        --muted: #5b6478;
        --line: #d8dce6;
        --accent: #ffc93c;
        --ok: #1f6f4a;
        --no: #c0392b;
        --held: #a9690f;
        --serif: "Fraunces", Georgia, serif;
        --sans: "Public Sans", system-ui, sans-serif;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      html,
      body {
        height: 100%;
      }
      body {
        background: var(--bg);
        color: var(--ink);
        font-family: var(--sans);
        overflow: hidden;
      }
      .page {
        height: 100vh;
        display: flex;
        flex-direction: column;
        padding: min(5vh, 5vw) min(6vw, 64px) min(4vh, 4vw);
      }

      .halt {
        display: none;
        color: var(--no);
        font-size: max(15px, min(2.4vh, 2.2vw));
        padding-bottom: 1.2vh;
      }
      body.is-halted .halt {
        display: block;
      }

      header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 24px;
        padding-bottom: 2vh;
      }
      .shop {
        font-family: var(--serif);
        font-weight: 700;
        font-size: max(32px, min(8vh, 7vw));
        line-height: 1;
      }
      .shop::after {
        content: "";
        display: block;
        width: 1.4em;
        height: max(4px, 0.6vh);
        background: var(--accent);
        margin-top: 1.2vh;
      }
      .sub {
        font-size: max(15px, min(2.4vh, 2.2vw));
        color: var(--muted);
        margin-top: 1.2vh;
      }
      .qr {
        text-align: center;
        flex: none;
      }
      .qr .code {
        width: max(72px, min(13vh, 12vw));
        height: max(72px, min(13vh, 12vw));
      }
      .qr .code svg {
        width: 100%;
        height: 100%;
        display: block;
      }
      .qr .cap {
        font-size: max(14px, min(1.9vh, 1.8vw));
        color: var(--muted);
        margin-top: 4px;
      }

      main {
        flex: 1 1 auto;
        min-height: 0;
        display: flex;
        flex-direction: column;
      }
      .item {
        flex: 1 1 0;
        min-height: 0;
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        column-gap: 24px;
        align-content: center;
        border-top: 1px solid var(--line);
        padding: 0.8vh 8px;
        border-radius: 6px;
      }
      .item:first-child {
        border-top-color: var(--ink);
      }
      .name {
        font-family: var(--serif);
        font-weight: 500;
        font-size: max(26px, min(6.4vh, 6vw));
        line-height: 1.05;
      }
      .fr {
        font-size: max(14px, min(2.4vh, 2.3vw));
        color: var(--muted);
        margin-top: 0.4vh;
      }
      .price {
        font-family: var(--serif);
        font-weight: 700;
        font-size: max(26px, min(6.4vh, 6vw));
        line-height: 1.05;
        text-align: right;
      }
      .promo {
        grid-column: 1 / -1;
        margin-top: 0.8vh;
      }
      .promo .en {
        font-size: max(16px, min(3.2vh, 3vw));
        font-weight: 700;
      }
      .promo .en span {
        background: var(--accent);
        padding: 0 0.25em;
      }
      .promo .pfr {
        font-size: max(14px, min(2.1vh, 2vw));
        color: var(--muted);
        margin-top: 0.3vh;
      }
      .sold .name,
      .sold .price {
        color: var(--muted);
        text-decoration: line-through;
        text-decoration-thickness: 2px;
      }
      .sold .promo .en span {
        background: none;
        color: var(--muted);
      }
      .soldtxt {
        color: var(--no);
        font-size: max(15px, min(2.6vh, 2.5vw));
        font-weight: 700;
        margin-top: 0.4vh;
      }
      .item.changed {
        animation: fade 2.4s ease-out;
      }
      @keyframes fade {
        from {
          background: var(--accent);
        }
        to {
          background: transparent;
        }
      }

      .status {
        position: fixed;
        top: 6px;
        right: 10px;
        font-size: 12px;
        color: var(--muted);
      }
      .status.offline {
        color: var(--no);
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="halt" role="alert">Updates paused</div>
      <header>
        <div>
          <h1 class="shop">Chez Marie</h1>
          <div class="sub">Today's board · L'ardoise du jour</div>
        </div>
        <div class="qr">
          <div class="code" id="qr" aria-label="QR code to the live menu"></div>
          <div class="cap">Live menu</div>
        </div>
      </header>
      <main id="items" aria-live="polite"></main>
    </div>
    <div class="status" id="status"></div>
    <script src="/vendor/qrcode.js"></script>
    <script src="/app.js"></script>
    <script>
      (function () {
        var esc = YC.esc,
          money = YC.money;
        var prev = {},
          lastAll = null;
        var itemsEl = document.getElementById("items");
        var statusEl = document.getElementById("status");

        // QR to /menu: public_url from /api/config when set, else this host
        function drawQR(base) {
          try {
            var target = base + "/menu" + (YC.MOCK ? "?mock=1" : "");
            var qr = qrcode(0, "M");
            qr.addData(target);
            qr.make();
            document.getElementById("qr").innerHTML = qr.createSvgTag({
              cellSize: 4,
              margin: 0,
              scalable: true,
            });
            document.getElementById("qr").title = target;
          } catch (e) {
            console.warn("QR failed", e);
          }
        }
        drawQR(location.origin);
        YC.config().then(function (c) {
          if (c.public_url) drawQR(c.public_url);
        });

        function sig(it) {
          return [
            it.text_en,
            it.text_fr,
            it.price,
            it.sold_out,
            it.promo_en,
            it.promo_fr,
            it.ends_at,
          ].join("|");
        }
        function render(state) {
          document.body.classList.toggle("is-halted", !!state.halted);
          var items = state.sign || [];
          var allSig = items.map(sig).join("~");
          if (allSig === lastAll) return;
          lastAll = allSig;
          itemsEl.innerHTML = items
            .map(function (it) {
              var promo = "";
              if (it.promo_en || it.promo_fr) {
                promo =
                  '<div class="promo"><div class="en"><span>' +
                  esc(it.promo_en || "") +
                  (it.ends_at && !/until/i.test(it.promo_en || "") ? " until " + esc(it.ends_at) : "") +
                  "</span></div>" +
                  (it.promo_fr
                    ? '<div class="pfr">' +
                      esc(it.promo_fr) +
                      (it.ends_at && !/jusqu/i.test(it.promo_fr || "")
                        ? " · jusqu'à " + esc(it.ends_at.replace(":", " h "))
                        : "") +
                      "</div>"
                    : "") +
                  "</div>";
              }
              return (
                '<div class="item' +
                (it.sold_out ? " sold" : "") +
                '" data-id="' +
                esc(it.item_id) +
                '">' +
                '<div><div class="name">' +
                esc(it.text_en) +
                '</div><div class="fr">' +
                esc(it.text_fr) +
                "</div>" +
                (it.sold_out
                  ? '<div class="soldtxt">Sold out · Épuisé</div>'
                  : "") +
                "</div>" +
                '<div class="price">' +
                esc(money(it.price)) +
                "</div>" +
                promo +
                "</div>"
              );
            })
            .join("");
          var first = Object.keys(prev).length === 0;
          items.forEach(function (it) {
            var s = sig(it);
            if (!first && prev[it.item_id] !== s) {
              var el = itemsEl.querySelector(
                '[data-id="' + CSS.escape(it.item_id) + '"]',
              );
              if (el) {
                el.classList.add("changed");
                setTimeout(function () {
                  el.classList.remove("changed");
                }, 2500);
              }
            }
            prev[it.item_id] = s;
          });
        }
        YC.connect(render, function (st) {
          statusEl.textContent =
            st === "live" ? "" : st === "mock" ? "mock" : st;
          statusEl.className = "status" + (st === "offline" ? " offline" : "");
        });
      })();
    </script>
  </body>
</html>
