<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Yes Chef · approvals (owner)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Fraunces:opsz,wght@9..144,500;9..144,700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #ffffff;
        --ink: #14213d;
        --muted: #5b6478;
        --line: #d8dce6;
        --accent: #ffc93c;
        --ok: #1f6f4a;
        --no: #c0392b;
        --held: #a9690f;
        --serif: "Fraunces", Georgia, serif;
        --sans: "Atkinson Hyperlegible", system-ui, sans-serif;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      body {
        background: var(--bg);
        color: var(--ink);
        font: 16px/1.4 var(--sans);
      }
      button {
        font: inherit;
      }
      .wrap {
        max-width: 520px;
        margin: 0 auto;
        padding: 22px 16px 80px;
      }
      h1 {
        font-family: var(--serif);
        font-weight: 700;
        font-size: 28px;
      }
      .sub {
        color: var(--muted);
        font-size: 15px;
        margin-top: 4px;
      }
      .halted {
        display: none;
        color: var(--no);
        font-weight: 700;
        margin-top: 12px;
      }
      body.is-halted .halted {
        display: block;
      }
      .block {
        border-top: 1px solid var(--line);
        padding: 16px 0;
      }
      .block:first-of-type {
        margin-top: 16px;
      }
      h2 {
        font-size: 16px;
        font-weight: 700;
        margin-bottom: 6px;
      }
      .msg {
        font-size: 16px;
      }
      .checkin.on .msg b {
        color: var(--ok);
      }
      .btn {
        display: block;
        width: 100%;
        margin-top: 12px;
        border-radius: 6px;
        padding: 14px 10px;
        font-size: 18px;
        font-weight: 700;
        cursor: pointer;
      }
      .btn.ink {
        background: var(--ink);
        color: var(--bg);
        border: 2px solid var(--ink);
      }
      .btn.outline {
        background: var(--bg);
        color: var(--ink);
        border: 2px solid var(--ink);
      }
      .btn.red {
        background: var(--bg);
        color: var(--no);
        border: 2px solid var(--no);
      }
      .btn:disabled {
        opacity: 0.5;
      }
      .claim {
        color: var(--held);
        font-weight: 700;
        margin-bottom: 6px;
      }
      .claim span {
        display: block;
        font-weight: 400;
      }
      .who {
        font-size: 15px;
        color: var(--muted);
      }
      .who b {
        color: var(--ink);
      }
      .what {
        font-family: var(--serif);
        font-weight: 500;
        font-size: 22px;
        margin: 4px 0;
      }
      .quote {
        font-size: 16px;
      }
      .why {
        font-size: 15px;
        color: var(--held);
        margin-top: 6px;
      }
      .btns {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
      .empty {
        color: var(--muted);
        padding: 24px 0;
      }
      .empty b {
        display: block;
        color: var(--ink);
        font-size: 18px;
      }
      .toast {
        position: fixed;
        left: 16px;
        right: 16px;
        bottom: 16px;
        max-width: 488px;
        margin: 0 auto;
        background: var(--ink);
        color: var(--bg);
        border-radius: 6px;
        padding: 12px 14px;
        display: none;
      }
      .toast.show {
        display: block;
      }
      .conn {
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>Approvals</h1>
      <div class="sub">
        Chez Marie · signed in as Marie (owner)
        <span class="conn" id="conn"></span>
      </div>
      <div class="halted">
        Updates are paused. Approved changes will not publish until they resume.
      </div>
      <div class="block checkin" id="checkin"></div>
      <div id="list"></div>
    </div>
    <div class="toast" id="toast" role="status"></div>
    <script src="/app.js"></script>
    <script>
      (function () {
        var esc = YC.esc,
          list = document.getElementById("list"),
          toastT;
        function toast(msg) {
          var t = document.getElementById("toast");
          t.textContent = msg;
          t.classList.add("show");
          clearTimeout(toastT);
          toastT = setTimeout(function () {
            t.classList.remove("show");
          }, 3500);
        }
        function ago(iso) {
          var s = Math.round((Date.now() - new Date(iso).getTime()) / 1000);
          if (!isFinite(s)) return "";
          return s < 60 ? s + "s ago" : Math.round(s / 60) + " min ago";
        }

        // ---------- owner check-in (session from this device)
        var lastState = null,
          sessionBusy = false,
          checkinKey = null;
        var checkin = document.getElementById("checkin");
        function fmtClock(iso) {
          var d = new Date(iso);
          return isNaN(d)
            ? ""
            : d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
        }
        function drawCheckin() {
          var left = YC.ownerLeftMs(lastState);
          var os = lastState && lastState.owner_session;
          var key = left > 0 ? "on|" + os.expires_at : "off";
          if (key === checkinKey) {
            if (left > 0)
              document.getElementById("left").textContent = YC.mmss(left);
            return;
          }
          checkinKey = key;
          if (left > 0) {
            checkin.className = "block checkin on";
            checkin.innerHTML =
              '<h2>Owner check-in</h2><div class="msg"><b>Checked in</b> until ' +
              esc(fmtClock(os.expires_at)) +
              ' (<span id="left">' +
              YC.mmss(left) +
              "</span> left). Requests made as you at the counter run as the owner.</div>" +
              '<button class="btn outline" type="button" data-open="0"' +
              (sessionBusy ? " disabled" : "") +
              ">I've left</button>";
          } else {
            checkin.className = "block checkin off";
            checkin.innerHTML =
              '<h2>Owner check-in</h2><div class="msg">You are not checked in. Requests made in your name at the counter are held and sent here.</div>' +
              '<button class="btn ink" type="button" data-open="1"' +
              (sessionBusy ? " disabled" : "") +
              ">I'm at the counter</button>";
          }
        }
        checkin.addEventListener("click", async function (e) {
          var b = e.target.closest("button[data-open]");
          if (!b || sessionBusy) return;
          var open = b.getAttribute("data-open") === "1";
          sessionBusy = true;
          b.disabled = true;
          try {
            await YC.api("/api/session", {
              json: open ? { open: true, minutes: 10 } : { open: false },
            });
            toast(open ? "Checked in for 10 minutes." : "Checked out.");
          } catch (err) {
            toast("Check-in failed: " + err.message);
          } finally {
            sessionBusy = false;
            checkinKey = null;
            drawCheckin();
          }
        });
        setInterval(drawCheckin, 1000);

        function render(s) {
          lastState = s;
          drawCheckin();
          document.body.classList.toggle("is-halted", !!s.halted);
          var p = s.pending || [];
          if (!p.length) {
            list.innerHTML =
              '<div class="block empty"><b>Nothing waiting</b>Requests appear here when someone asks for more than their rules allow.</div>';
            return;
          }
          list.innerHTML = p
            .map(function (a) {
              return (
                '<div class="block">' +
                (a.claimed_as
                  ? '<div class="claim">' +
                    esc(a.requested_by) +
                    ", speaking as " +
                    esc(a.claimed_as) +
                    "<span>Someone at the counter, speaking as " +
                    esc(a.claimed_as) +
                    ". Was that you?</span></div>"
                  : "") +
                '<div class="who"><b>' +
                esc(a.requested_by) +
                "</b> (" +
                esc(a.role) +
                ") · " +
                esc(ago(a.created_at)) +
                "</div>" +
                '<div class="what">' +
                esc(a.summary) +
                '</div><div class="quote">“' +
                esc(a.utterance) +
                "”</div>" +
                '<div class="why">Held because: ' +
                esc(a.reason) +
                '</div><div class="btns">' +
                '<button class="btn ink" data-id="' +
                esc(a.action_id) +
                '" data-approve="1">Approve</button>' +
                '<button class="btn red" data-id="' +
                esc(a.action_id) +
                '" data-approve="0">Reject</button></div></div>'
              );
            })
            .join("");
        }
        list.addEventListener("click", async function (e) {
          var b = e.target.closest("button[data-id]");
          if (!b) return;
          var card = b.closest(".block");
          card.querySelectorAll("button").forEach(function (x) {
            x.disabled = true;
          });
          try {
            var r = await YC.api("/api/approve", {
              json: {
                action_id: b.getAttribute("data-id"),
                approve: b.getAttribute("data-approve") === "1",
              },
            });
            toast(r && r.say ? r.say : "Done.");
          } catch (err) {
            toast("Failed: " + err.message);
            card.querySelectorAll("button").forEach(function (x) {
              x.disabled = false;
            });
          }
        });
        YC.connect(render, function (st) {
          document.getElementById("conn").textContent =
            st === "live" ? "" : "· " + st;
        });
      })();
    </script>
  </body>
</html>
