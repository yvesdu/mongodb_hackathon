<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Yes Chef · stage</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #ffffff;
        overflow: hidden;
      }
      .stage {
        display: flex;
        height: 100vh;
      }
      iframe {
        border: 0;
        height: 100%;
        display: block;
      }
      #sign {
        width: 62%;
      }
      #counter {
        width: 38%;
        border-left: 1px solid #d8dce6;
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <iframe id="sign" title="Shop sign"></iframe>
      <iframe
        id="counter"
        title="Counter"
        allow="microphone; autoplay"
      ></iframe>
    </div>
    <script>
      (function () {
        var qs = new URLSearchParams(location.search),
          pass = new URLSearchParams();
        if (qs.get("mock")) pass.set("mock", qs.get("mock"));
        var signQ = pass.toString();
        if (qs.get("key")) pass.set("key", qs.get("key"));
        if (qs.get("owner")) pass.set("owner", qs.get("owner"));
        var counterQ = pass.toString();
        document.getElementById("sign").src =
          "/sign" + (signQ ? "?" + signQ : "");
        document.getElementById("counter").src =
          "/counter" + (counterQ ? "?" + counterQ : "");
      })();
    </script>
  </body>
</html>
