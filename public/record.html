<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Yes Chef · record</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Fraunces:opsz,wght@9..144,500;9..144,700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FFFFFF; --ink: #14213D; --muted: #5B6478; --line: #D8DCE6;
    --accent: #FFC93C; --ok: #1F6F4A; --no: #C0392B; --held: #A9690F;
    --serif: "Fraunces", Georgia, serif;
    --sans: "Atkinson Hyperlegible", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--sans); }
  .layout { max-width: 1100px; margin: 0 auto; padding: 24px 16px 50px; display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 40px; align-items: start; }
  @media (max-width: 860px) { .layout { grid-template-columns: 1fr; } }
  h1 { font-family: var(--serif); font-weight: 700; font-size: 28px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin-bottom: 12px; }
  .mono { font-family: var(--sans); }
  .stage { border-top: 1px solid var(--line); padding: 14px 0; }
  .stage h2 { font-size: 16px; font-weight: 700; margin: 0 0 6px; }
  .words { font-family: var(--serif); font-weight: 500; font-size: 22px; line-height: 1.4; }
  mark { background: var(--accent); color: inherit; padding: 0 2px; }
  mark sub { font-family: var(--sans); font-size: 12px; color: var(--ink); margin-left: 3px; vertical-align: baseline; }
  table { width: 100%; border-collapse: collapse; }
  td, th { text-align: left; padding: 5px 8px 5px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 400; }
  .badge { font-weight: 700; }
  .b-ok { color: var(--ok); } .b-no { color: var(--no); } .b-held { color: var(--held); } .b-dim { color: var(--muted); }
  .arrow { color: var(--muted); padding: 0 6px; }
  .gate-line { font-size: 17px; }
  .chain { font-weight: 700; }
  .chain.ok { color: var(--ok); } .chain.bad { color: var(--no); }
  .chain .small { color: var(--muted); }
  aside { position: sticky; top: 16px; }
  aside h2 { font-size: 16px; font-weight: 700; margin: 0 0 8px; }
  aside a { display: block; text-decoration: none; color: inherit; padding: 8px 6px; border-top: 1px solid var(--line); border-radius: 6px; }
  aside a:hover .t { text-decoration: underline; }
  aside a.cur { border-left: 4px solid var(--accent); padding-left: 10px; }
  aside .t { font-weight: 700; }
  aside .u { color: var(--muted); font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .err { color: var(--no); }
  .small { font-size: 14px; color: var(--muted); }
</style>
  </head>
  <body>
    <div class="layout">
      <main>
        <h1>Action record</h1>
        <div class="sub" id="sub">Loading…</div>
        <div class="trace" id="trace"></div>
      </main>
      <aside>
        <h2>Recent actions</h2>
        <div id="actions" class="small">Loading…</div>
      </aside>
    </div>
    <script src="/app.js"></script>
    <script>
      (function () {
        var esc = YC.esc,
          money = YC.money;
        var currentId = YC.qs.get("action_id");

        function statusBadge(s) {
          var cls = /verified|allowed|applied|allow/.test(s)
            ? "b-ok"
            : /blocked|rejected|failed|halted|deny/.test(s)
              ? "b-no"
              : /pending|needs_approval|held/.test(s)
                ? "b-held"
                : "b-dim";
          return '<span class="badge ' + cls + '">' + esc(s) + "</span>";
        }
        function fmtTime(iso) {
          var d = new Date(iso);
          return isNaN(d)
            ? esc(iso || "")
            : d.toLocaleTimeString([], {
                hour: "2-digit",
                minute: "2-digit",
                second: "2-digit",
              });
        }

        function highlight(text, evidence) {
          var spans = (evidence || [])
            .filter(function (e) {
              return e.span && e.span.length === 2 && e.span[1] > e.span[0];
            })
            .map(function (e) {
              return { s: e.span[0], e: e.span[1], f: e.field };
            })
            .sort(function (a, b) {
              return a.s - b.s;
            });
          var out = "",
            pos = 0;
          spans.forEach(function (sp) {
            if (sp.s < pos || sp.e > text.length) return; // skip overlaps / bad spans
            out +=
              esc(text.slice(pos, sp.s)) +
              "<mark>" +
              esc(text.slice(sp.s, sp.e)) +
              "<sub>" +
              esc(sp.f) +
              "</sub></mark>";
            pos = sp.e;
          });
          return out + esc(text.slice(pos));
        }

        function detailText(d) {
          if (!d || typeof d !== "object") return "";
          var parts = [];
          if (d.target) parts.push(d.target);
          if (d.rule_id) parts.push(d.rule_id + (d.version != null ? " v" + d.version : ""));
          if (d.approver_name) parts.push("by " + d.approver_name);
          if (d.changes && typeof d.changes === "object") parts.push(Object.keys(d.changes).map(function (k) { return k + "=" + JSON.stringify(d.changes[k]); }).join(", "));
          if (d.field) parts.push(d.field);
          if (d.undo_action_id) parts.push("undone by " + d.undo_action_id);
          if (!parts.length) { var j = JSON.stringify(d); parts.push(j === "{}" ? "" : j); }
          var t = parts.join(" · ");
          return t.length > 90 ? t.slice(0, 89) + "…" : t;
        }
        // Copy of the chain head kept outside Atlas: catches a rewrite/truncation of the whole log.
        function anchorBadge(c) {
          var an = c && c.anchor;
          if (!an) return "";
          if (an.matches) {
            if (!c.ok) return "";
            return '<div class="chain ok">Chain intact · ' + esc(c.entries) +
              " entries · matches the anchor kept outside Atlas (entry #" + esc(an.seq) + ")" +
              ' <span class="small mono" style="font-weight:500">' + esc(String(an.hash || "").slice(0, 10)) + "…</span></div>";
          }
          return '<div class="chain bad">Audit log does not match the anchor kept outside Atlas (entry #' +
            esc(an.seq) + ", anchored " + fmtTime(an.at) + "): history was rewritten or truncated</div>";
        }
        function summarize(name, d) {
          if (!d) return '<span class="small">none</span>';
          var parts = [];
          if (d.price != null) parts.push(money(d.price));
          if (name === "till") {
            parts.push(d.available === false ? "sold out" : "available");
            parts.push(
              d.discount_pct ? d.discount_pct + "% off" : "no discount",
            );
          } else {
            parts.push(d.sold_out ? "sold out" : "available");
            parts.push(
              d.promo_en
                ? "promo “" +
                    d.promo_en +
                    "”" +
                    (d.ends_at ? " until " + d.ends_at : "")
                : "no promo",
            );
          }
          return esc(parts.join(" · "));
        }
        function applyParams(name, prev, type, p) {
          if (!prev) return null;
          var d = JSON.parse(JSON.stringify(prev));
          p = p || {};
          if (type === "set_price" && p.price != null) d.price = p.price;
          if (type === "mark_sold_out") {
            if (name === "till") d.available = false;
            else d.sold_out = true;
          }
          if (type === "mark_available") {
            if (name === "till") d.available = true;
            else d.sold_out = false;
          }
          if (type === "start_promo") {
            if (name === "till") d.discount_pct = p.discount_pct;
            else {
              d.promo_en = p.text_en;
              d.promo_fr = p.text_fr;
              d.ends_at = p.ends_at || null;
            }
          }
          return d;
        }

        function render(rv) {
          var a = rv.action || {},
            actor = a.actor || {},
            pol = a.policy || {},
            u = a.utterance || {};
          document.title = "Yes Chef · Record " + (a._id || "");
          document.getElementById("sub").innerHTML =
            '<span class="mono">' +
            esc(a._id) +
            "</span> · " +
            esc(a.type) +
            (rv.item_name ? " · " + esc(rv.item_name) : "") +
            " · " +
            statusBadge(a.status) +
            " · " +
            fmtTime(a.created_at);
          var h = "";
          var polCls =
            pol.decision === "allow"
              ? "ok"
              : pol.decision === "deny"
                ? "no"
                : pol.decision === "needs_approval"
                  ? "held"
                  : "";

          h +=
            '<section class="stage ok"><h2>1 · Who spoke</h2><div class="gate-line">' +
            esc(rv.speaker_name || actor.human_id) +
            ' <span class="small">(' +
            esc(actor.role) +
            ")</span></div>" +
            '<div class="small mono">' +
            esc(actor.human_id) +
            " via " +
            esc(actor.agent_id) +
            " · speech: " +
            esc(u.stt) +
            "</div></section>";

          h +=
            '<section class="stage ok"><h2>2 · Exact words</h2><div class="words">“' +
            highlight(u.text || "", a.evidence) +
            "”</div></section>";

          var ev = a.evidence || [];
          h +=
            '<section class="stage ' +
            (ev.length ? "ok" : "") +
            '"><h2>3 · Extracted values</h2>' +
            (ev.length
              ? "<table><thead><tr><th>Field</th><th>Value</th><th>Quote</th><th>Span</th></tr></thead><tbody>" +
                ev
                  .map(function (e) {
                    return (
                      "<tr><td class=mono>" +
                      esc(e.field) +
                      "</td><td><b>" +
                      esc(e.value) +
                      "</b></td><td>" +
                      (e.quote
                        ? "“" + esc(e.quote) + "”"
                        : '<span class="small">no quote</span>') +
                      '</td><td class="mono small">' +
                      (e.span ? esc(e.span[0] + "–" + e.span[1]) : "") +
                      "</td></tr>"
                    );
                  })
                  .join("") +
                "</tbody></table>"
              : '<div class="small">No values.</div>') +
            '<div class="small mono" style="margin-top:6px">params ' +
            esc(JSON.stringify(a.params || {})) +
            "</div></section>";

          var NAMES = { usr_marie: "Marie", usr_sam: "Sam" };
          var heldRule = {}, approverName = NAMES[pol.approved_by] || pol.approved_by;
          (rv.audit || []).forEach(function (e) {
            var d = e.detail || {};
            if (e.event === "policy.held") heldRule = { rule_id: d.rule_id, version: d.version };
            if (e.event === "approval.granted" && d.approver_name) approverName = d.approver_name;
          });
          h +=
            '<section class="stage ' +
            polCls +
            '"><h2>4 · Gate decision</h2><div class="gate-line">' +
            statusBadge(pol.decision || "?") +
            " rule <span class=mono>" +
            esc(pol.rule_id || "none (default deny)") +
            "</span>" +
            (pol.version != null ? " v" + esc(pol.version) : "") +
            "</div>" +
            (pol.reason
              ? '<div style="margin-top:4px">' + esc(pol.reason) + "</div>"
              : "") +
            (pol.approved_by
              ? '<div style="margin-top:8px">' + statusBadge("held") +
                " Held by rule <span class=mono>" + esc(heldRule.rule_id || pol.rule_id || "?") + "</span>" +
                ((heldRule.version != null ? heldRule.version : pol.version) != null ? " v" + esc(heldRule.version != null ? heldRule.version : pol.version) : "") +
                '</div><div style="margin-top:4px">' + statusBadge("approved") +
                " Approved by <b>" + esc(approverName) + "</b> (<span class=mono>" + esc(pol.approved_by) + "</span>) at " +
                fmtTime(pol.approved_at) + "</div>"
              : "") +
            "</section>";

          var tg = a.targets || [];
          h +=
            '<section class="stage ' +
            (tg.length &&
            tg.every(function (t) {
              return t.status === "verified";
            })
              ? "ok"
              : tg.length
                ? "held"
                : "") +
            '"><h2>5 · Targets</h2>' +
            (tg.length
              ? "<table><thead><tr><th>Target</th><th>Previous → new</th><th>Status</th></tr></thead><tbody>" +
                tg
                  .map(function (t) {
                    return (
                      "<tr><td class=mono>" +
                      esc(t.name) +
                      "</td><td>" +
                      summarize(t.name, t.previous) +
                      '<span class="arrow">→</span><b>' +
                      (a.type === "undo"
                        ? "restored"
                        : summarize(
                            t.name,
                            applyParams(t.name, t.previous, a.type, a.params),
                          )) +
                      "</b></td><td>" +
                      statusBadge(t.status) +
                      (t.verified_at
                        ? '<div class="small">' +
                          fmtTime(t.verified_at) +
                          "</div>"
                        : "") +
                      "</td></tr>"
                    );
                  })
                  .join("") +
                "</tbody></table>"
              : '<div class="small">Nothing was written.</div>') +
            "</section>";

          var au = rv.audit || [];
          h +=
            '<section class="stage ' +
            (au.length ? "ok" : "") +
            '"><h2>6 · Audit log (' +
            au.length +
            ")</h2>" +
            (au.length
              ? '<table class="mono"><thead><tr><th>Seq</th><th>Time</th><th>Event</th><th>By</th><th>Detail</th><th>Hash</th></tr></thead><tbody>' +
                au
                  .map(function (e) {
                    return (
                      "<tr><td>" +
                      esc(e.seq) +
                      "</td><td>" +
                      fmtTime(e.ts) +
                      "</td><td>" +
                      esc(e.event) +
                      "</td><td>" +
                      esc((e.actor && e.actor.human_id) || "") +
                      '</td><td class="small">' +
                      esc(detailText(e.detail)) +
                      '</td><td title="prev ' +
                      esc(e.prev_hash) +
                      '">' +
                      esc(String(e.hash || "").slice(0, 10)) +
                      "…</td></tr>"
                    );
                  })
                  .join("") +
                "</tbody></table>"
              : '<div class="small">No entries.</div>') +
            "</section>";

          var c = rv.chain || {};
          var anchorLine = anchorBadge(c);
          h +=
            '<section class="stage"><h2>7 · Chain check</h2>' +
            (anchorLine && c.ok
              ? anchorLine
              : '<div class="chain ' + (c.ok ? "ok" : "bad") + '">' +
                (c.ok ? "Hash chain intact · " + esc(c.entries) + " entries checked" : "Chain broken at entry #" + esc(c.broken_at) + " · " + esc(c.entries) + " entries checked") +
                "</div>" + (c.ok ? "" : anchorLine)) +
            "</section>";

          document.getElementById("trace").innerHTML = h;
        }

        function load(id) {
          currentId = id;
          YC.api(
            "/api/record" + (id ? "?action_id=" + encodeURIComponent(id) : ""),
          )
            .then(function (rv) {
              if (!rv) {
                document.getElementById("sub").textContent = "No action found.";
                document.getElementById("trace").innerHTML = "";
                return;
              }
              render(rv);
              markCurrent(rv.action && rv.action._id);
            })
            .catch(function (e) {
              document.getElementById("sub").innerHTML =
                '<span class="err">Could not load record: ' +
                esc(e.message) +
                "</span>";
            });
        }
        function markCurrent(id) {
          document.querySelectorAll("aside a").forEach(function (x) {
            x.classList.toggle("cur", x.getAttribute("data-id") === id);
          });
        }

        function loadActions() {
          YC.api("/api/actions?limit=20")
            .then(function (rows) {
              rows = Array.isArray(rows) ? rows : (rows && rows.actions) || [];
              document.getElementById("actions").innerHTML = rows.length
                ? rows
                    .map(function (r) {
                      var id = r._id || r.action_id,
                        act = r.actor || {},
                        ut = r.utterance || {};
                      var href = YC.withMock(
                        "/record?action_id=" + encodeURIComponent(id),
                      );
                      return (
                        '<a href="' +
                        esc(href) +
                        '" data-id="' +
                        esc(id) +
                        '"><div class="t">' +
                        esc(r.type) +
                        " " +
                        statusBadge(r.status || "") +
                        '</div><div class="u">' +
                        esc(act.human_id || "") +
                        " · " +
                        esc(ut.text || r.text || "") +
                        "</div></a>"
                      );
                    })
                    .join("")
                : "No actions yet.";
              markCurrent(currentId);
            })
            .catch(function (e) {
              document.getElementById("actions").innerHTML =
                '<span class="err">' + esc(e.message) + "</span>";
            });
        }
        document
          .getElementById("actions")
          .addEventListener("click", function (e) {
            var a = e.target.closest("a[data-id]");
            if (!a) return;
            e.preventDefault();
            history.pushState(null, "", a.getAttribute("href"));
            load(a.getAttribute("data-id"));
          });
        window.addEventListener("popstate", function () {
          load(new URLSearchParams(location.search).get("action_id"));
        });
        load(currentId);
        loadActions();
      })();
    </script>
  </body>
</html>
