<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Chez Marie · Menu</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #faf6ef;
        --card: #ffffff;
        --ink: #1d1a16;
        --dim: #6f675d;
        --line: #ece4d8;
        --accent: #c4622d;
        --accent-bg: #fbe9dd;
        --red: #c0392b;
        --ok: #2e7d4f;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #15130f;
          --card: #1f1c17;
          --ink: #f4efe7;
          --dim: #a69d91;
          --line: #2e2922;
          --accent: #f0a46c;
          --accent-bg: #3a2618;
          --red: #ef6b5e;
          --ok: #5cc98a;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family:
          Inter,
          system-ui,
          -apple-system,
          sans-serif;
      }
      .wrap {
        max-width: 560px;
        margin: 0 auto;
        padding: 18px 16px 48px;
      }
      header {
        padding: 8px 0 14px;
      }
      h1 {
        font-family: Fraunces, Georgia, serif;
        font-weight: 800;
        font-size: 32px;
        margin: 0;
        letter-spacing: -0.01em;
      }
      .sub {
        color: var(--dim);
        font-size: 14px;
        margin-top: 2px;
      }
      .live {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        font-weight: 600;
        color: var(--ok);
        margin-top: 8px;
      }
      .live::before {
        content: "";
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: currentColor;
        animation: blink 2s infinite;
      }
      .live.off {
        color: var(--red);
      }
      @keyframes blink {
        50% {
          opacity: 0.35;
        }
      }
      .notice {
        display: none;
        background: var(--red);
        color: #fff;
        border-radius: 12px;
        padding: 10px 12px;
        font-weight: 600;
        font-size: 14px;
        margin-bottom: 12px;
      }
      body.is-halted .notice {
        display: block;
      }
      .list {
        display: grid;
        gap: 10px;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 14px 16px;
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 4px 12px;
        align-items: start;
        transition: box-shadow 0.4s;
      }
      .card.changed {
        animation: flash 2s ease-out;
      }
      @keyframes flash {
        from {
          box-shadow: 0 0 0 3px var(--accent);
        }
        to {
          box-shadow: 0 0 0 0 transparent;
        }
      }
      .name {
        font-family: Fraunces, Georgia, serif;
        font-weight: 600;
        font-size: 20px;
      }
      .fr {
        color: var(--dim);
        font-size: 14px;
        font-style: italic;
      }
      .price {
        font-weight: 700;
        font-size: 18px;
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
      .price .was {
        display: block;
        font-weight: 500;
        font-size: 12px;
        color: var(--dim);
      }
      .promo {
        grid-column: 1 / -1;
        margin-top: 6px;
        background: var(--accent-bg);
        color: var(--accent);
        border-radius: 10px;
        padding: 8px 10px;
        font-size: 14px;
        font-weight: 600;
      }
      .promo .pfr {
        font-weight: 400;
        font-style: italic;
        opacity: 0.85;
        font-size: 13px;
      }
      .card.sold .name,
      .card.sold .fr {
        opacity: 0.5;
      }
      .card.sold .price {
        color: var(--dim);
        text-decoration: line-through;
      }
      .badge {
        display: inline-block;
        margin-top: 6px;
        background: var(--red);
        color: #fff;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.06em;
        padding: 3px 8px;
        border-radius: 999px;
      }
      .add {
        grid-column: 1 / -1;
        justify-self: start;
        margin-top: 8px;
        border: 1px solid var(--line);
        background: transparent;
        color: var(--ink);
        font:
          600 14px Inter,
          sans-serif;
        border-radius: 999px;
        padding: 7px 14px;
      }
      .add:disabled {
        opacity: 0.4;
      }
      footer {
        margin-top: 20px;
        color: var(--dim);
        font-size: 12px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <h1>Chez Marie</h1>
        <div class="sub">Café &amp; boulangerie · order ahead</div>
        <div class="live" id="live">Live</div>
      </header>
      <div class="notice" role="alert">
        Menu changes are paused right now. Prices shown are current.
      </div>
      <div class="list" id="list"></div>
      <footer>Prices in CAD. This menu updates live from the shop.</footer>
    </div>
    <script src="/app.js"></script>
    <script>
      (function () {
        var esc = YC.esc,
          money = YC.money,
          prev = {},
          list = document.getElementById("list");
        function render(s) {
          document.body.classList.toggle("is-halted", !!s.halted);
          var items = (s.menu && s.menu.length ? s.menu : s.sign) || [];
          var till = {};
          (s.till || []).forEach(function (t) {
            till[t.item_id] = t;
          });
          list.innerHTML = items
            .map(function (it) {
              var t = till[it.item_id],
                disc = t && t.discount_pct ? t.discount_pct : null;
              var promo = it.promo_en
                ? '<div class="promo">' +
                  esc(it.promo_en) +
                  (it.ends_at ? " · until " + esc(it.ends_at) : "") +
                  (it.promo_fr
                    ? '<div class="pfr">' + esc(it.promo_fr) + "</div>"
                    : "") +
                  "</div>"
                : "";
              return (
                '<div class="card' +
                (it.sold_out ? " sold" : "") +
                '" data-id="' +
                esc(it.item_id) +
                '"><div><div class="name">' +
                esc(it.text_en) +
                '</div><div class="fr">' +
                esc(it.text_fr) +
                "</div>" +
                (it.sold_out
                  ? '<span class="badge">SOLD OUT · ÉPUISÉ</span>'
                  : "") +
                '</div><div class="price">' +
                esc(money(it.price)) +
                (disc && !it.sold_out
                  ? '<span class="was">' +
                    esc(disc) +
                    "% off at the till</span>"
                  : "") +
                "</div>" +
                promo +
                '<button class="add" type="button"' +
                (it.sold_out ? " disabled" : "") +
                ">" +
                (it.sold_out ? "Unavailable" : "Add to order") +
                "</button></div>"
              );
            })
            .join("");
          var first = !Object.keys(prev).length;
          items.forEach(function (it) {
            var sig = [it.price, it.sold_out, it.promo_en, it.ends_at].join(
              "|",
            );
            if (!first && prev[it.item_id] !== sig) {
              var el = list.querySelector(
                '[data-id="' + CSS.escape(it.item_id) + '"]',
              );
              if (el) el.classList.add("changed");
            }
            prev[it.item_id] = sig;
          });
        }
        YC.connect(render, function (st) {
          var l = document.getElementById("live");
          l.textContent =
            st === "live"
              ? "Live"
              : st === "mock"
                ? "Live (mock data)"
                : "Reconnecting…";
          l.className =
            "live" + (st === "offline" || st === "connecting" ? " off" : "");
        });
      })();
    </script>
  </body>
</html>
