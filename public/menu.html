<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Chez Marie · menu</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #ffffff;
        --ink: #14213d;
        --muted: #5b6478;
        --line: #d8dce6;
        --accent: #ffc93c;
        --ok: #1f6f4a;
        --no: #c0392b;
        --held: #a9690f;
        --serif: "Fraunces", Georgia, serif;
        --sans: "Public Sans", system-ui, sans-serif;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      body {
        background: var(--bg);
        color: var(--ink);
        font: 16px/1.4 var(--sans);
      }
      button {
        font: inherit;
      }
      .wrap {
        max-width: 560px;
        margin: 0 auto;
        padding: 24px 16px 48px;
      }
      h1 {
        font-family: var(--serif);
        font-weight: 700;
        font-size: 32px;
        line-height: 1.1;
      }
      h1::after {
        content: "";
        display: block;
        width: 44px;
        height: 4px;
        background: var(--accent);
        margin-top: 8px;
      }
      .sub {
        color: var(--muted);
        font-size: 15px;
        margin-top: 8px;
      }
      .live {
        font-size: 14px;
        color: var(--muted);
        margin-top: 4px;
      }
      .live.off {
        color: var(--no);
      }
      .notice {
        display: none;
        color: var(--no);
        font-weight: 700;
        margin-top: 12px;
      }
      body.is-halted .notice {
        display: block;
      }
      .list {
        margin-top: 18px;
        border-bottom: 1px solid var(--line);
      }
      .row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        column-gap: 12px;
        padding: 14px 6px;
        border-top: 1px solid var(--line);
        border-radius: 6px;
      }
      .name {
        font-family: var(--serif);
        font-weight: 500;
        font-size: 21px;
      }
      .fr {
        color: var(--muted);
        font-size: 14px;
      }
      .price {
        font-family: var(--serif);
        font-weight: 700;
        font-size: 20px;
        text-align: right;
      }
      .disc {
        display: block;
        font-family: var(--sans);
        font-weight: 400;
        font-size: 14px;
        color: var(--muted);
      }
      .promo {
        grid-column: 1 / -1;
        margin-top: 6px;
      }
      .promo .en {
        font-weight: 700;
      }
      .promo .en span {
        background: var(--accent);
        padding: 0 0.2em;
      }
      .promo .pfr {
        color: var(--muted);
        font-size: 14px;
      }
      .soldtxt {
        color: var(--no);
        font-weight: 700;
        font-size: 15px;
        margin-top: 2px;
      }
      .sold .name,
      .sold .price {
        color: var(--muted);
        text-decoration: line-through;
      }
      .add {
        grid-column: 1 / -1;
        justify-self: start;
        margin-top: 8px;
        background: var(--bg);
        color: var(--ink);
        border: 1px solid var(--ink);
        border-radius: 6px;
        padding: 6px 14px;
        font-size: 15px;
      }
      .add:disabled {
        border-color: var(--line);
        color: var(--muted);
      }
      .row.changed {
        animation: fade 2s ease-out;
      }
      @keyframes fade {
        from {
          background: var(--accent);
        }
        to {
          background: transparent;
        }
      }
      footer {
        margin-top: 18px;
        color: var(--muted);
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>Chez Marie</h1>
      <div class="sub">Café &amp; boulangerie · order ahead</div>
      <div class="live" id="live">Live</div>
      <div class="notice" role="alert">
        Menu updates are paused. Prices shown are current.
      </div>
      <div class="list" id="list"></div>
      <footer>Prices in CAD. This menu updates live from the shop.</footer>
    </div>
    <script src="/app.js"></script>
    <script>
      (function () {
        var esc = YC.esc,
          money = YC.money,
          prev = {},
          list = document.getElementById("list");
        function render(s) {
          document.body.classList.toggle("is-halted", !!s.halted);
          var items = (s.menu && s.menu.length ? s.menu : s.sign) || [];
          var till = {};
          (s.till || []).forEach(function (t) {
            till[t.item_id] = t;
          });
          list.innerHTML = items
            .map(function (it) {
              var t = till[it.item_id],
                disc = t && t.discount_pct ? t.discount_pct : null;
              var promo = it.promo_en
                ? '<div class="promo"><div class="en"><span>' +
                  esc(it.promo_en) +
                  (it.ends_at && !/until/i.test(it.promo_en || "") ? " until " + esc(it.ends_at) : "") +
                  "</span></div>" +
                  (it.promo_fr
                    ? '<div class="pfr">' + esc(it.promo_fr) + "</div>"
                    : "") +
                  "</div>"
                : "";
              return (
                '<div class="row' +
                (it.sold_out ? " sold" : "") +
                '" data-id="' +
                esc(it.item_id) +
                '"><div><div class="name">' +
                esc(it.text_en) +
                '</div><div class="fr">' +
                esc(it.text_fr) +
                "</div>" +
                (it.sold_out
                  ? '<div class="soldtxt">Sold out · Épuisé</div>'
                  : "") +
                '</div><div class="price">' +
                esc(money(it.price)) +
                (disc && !it.sold_out
                  ? '<span class="disc">' +
                    esc(disc) +
                    "% off at the till</span>"
                  : "") +
                "</div>" +
                promo +
                '<button class="add" type="button"' +
                (it.sold_out ? " disabled" : "") +
                ">" +
                (it.sold_out ? "Unavailable" : "Add to order") +
                "</button></div>"
              );
            })
            .join("");
          var first = !Object.keys(prev).length;
          items.forEach(function (it) {
            var sig = [it.price, it.sold_out, it.promo_en, it.ends_at].join(
              "|",
            );
            if (!first && prev[it.item_id] !== sig) {
              var el = list.querySelector(
                '[data-id="' + CSS.escape(it.item_id) + '"]',
              );
              if (el) el.classList.add("changed");
            }
            prev[it.item_id] = sig;
          });
        }
        YC.connect(render, function (st) {
          var l = document.getElementById("live");
          l.textContent =
            st === "live"
              ? "Live"
              : st === "mock"
                ? "Live (mock data)"
                : "Reconnecting…";
          l.className =
            "live" + (st === "offline" || st === "connecting" ? " off" : "");
        });
      })();
    </script>
  </body>
</html>
